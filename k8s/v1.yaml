
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharmacy-v1
  template:
    metadata:
      labels:
        app: pharmacy-v1
    spec:
      containers:
        - name: pharmacy
          image: madhan1710r/pharmacy-system:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "v1"
---
apiVersion: v1
kind: Service
metadata:
  name: pharmacy-v1-service
spec:
  type: NodePort
  selector:
    app: pharmacy-v1
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30081
