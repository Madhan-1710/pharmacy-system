
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharmacy-v3
  template:
    metadata:
      labels:
        app: pharmacy-v3
    spec:
      containers:
        - name: pharmacy-system
          image: madhan1710r/pharmacy-system:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "v3"
---
apiVersion: v1
kind: Service
metadata:
  name: pharmacy-v3-service
spec:
  type: NodePort
  selector:
    app: pharmacy-v3
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30083
